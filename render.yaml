services:
  - type: web
    name: edutrack-api
    runtime: docker
    rootDir: Springboot/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: edutrack-web
          property: host
      - key: RECOMMENDER_URL
        fromService:
          type: web
          name: edutrack-recommender
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75 -Xss512k"

  - type: web
    name: edutrack-recommender
    runtime: docker
    rootDir: Springboot/recommender
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: REC_WEIGHT_CONTENT
        value: "0.55"
      - key: REC_WEIGHT_PROFILE
        value: "0.35"
      - key: REC_WEIGHT_POPULARITY
        value: "0.05"
      - key: REC_WEIGHT_RECENCY
        value: "0.05"

  - type: web
    name: edutrack-web
    runtime: static
    rootDir: Springboot/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: edutrack-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
