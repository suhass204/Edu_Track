server:
  port: ${PORT:8080}

spring:
  application:
    name: edutrack-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/edutrack}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

edutrack:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  recommender:
    url: ${RECOMMENDER_URL:http://localhost:8000}
    timeout-ms: 2000
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  admin:
    seed-username: admin
    seed-email: admin123@gmail.com
    seed-password: admin123
